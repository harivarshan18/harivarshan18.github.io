<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hari Varshan</title>
  <meta name="description" content="Hari Varshan, Ph.D. student at Arizona State University: foundation and generative models for medical imaging and physiological time series.">
  <link rel="canonical" href="https://harivarshan18.github.io/">
  <meta property="og:title" content="Hari Varshan">
  <meta property="og:description" content="Foundation and generative models for medical imaging and physiological time series.">
  <meta property="og:image" content="https://harivarshan18.github.io/assets/img/hari.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="hero">
    <div class="hero-top wrap">
      <div class="hero-text">
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
        <ul class="status" id="status"></ul>
      </div>
      <img class="portrait" id="portrait" alt="Hari Varshan" width="640" height="640">
    </div>

    <figure class="strip" aria-label="Animated heart rhythm trace. Move across it to change the rate.">
      <canvas id="ecg"></canvas>
      <figcaption class="strip-readout"><span id="bpm">64</span> bpm</figcaption>
    </figure>

    <nav class="wrap links" id="links" aria-label="Profiles"></nav>
  </header>

  <div class="layout wrap">
    <nav class="toc" aria-label="Sections">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#research">Research</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#notes">Notes</a></li>
      </ul>
      <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
    </nav>

    <main id="main">
      <section id="about">
        <h2>About</h2>
        <div id="about-body" class="prose"></div>
      </section>

      <section id="research">
        <h2>Research</h2>
        <div class="filters" id="theme-filters" role="group" aria-label="Filter projects by theme"></div>
        <ul class="projects" id="projects"></ul>
      </section>

      <section id="publications">
        <h2>Publications</h2>
        <div class="pub-controls">
          <label class="search">
            <span class="visually-hidden">Search publications</span>
            <input type="search" id="pub-search" placeholder="Search titles, authors, venues">
          </label>
          <div class="filters" id="type-filters" role="group" aria-label="Filter by type"></div>
        </div>
        <div id="pubs"></div>
      </section>

      <section id="experience">
        <h2>Experience</h2>
        <dl class="exp" id="exp"></dl>
      </section>

      <section id="education">
        <h2>Education</h2>
        <dl class="exp" id="edu"></dl>
        <h3 class="sub">Honors and service</h3>
        <dl class="exp" id="honors"></dl>
      </section>

      <section id="notes">
        <h2>Notes</h2>
        <ul class="posts" id="posts"></ul>
      </section>
    </main>
  </div>

  <footer class="wrap foot">
    <p>Last updated <span id="updated"></span>.</p>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/ecg.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
